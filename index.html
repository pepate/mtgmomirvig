<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Momir Basic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #0a0f12;
    --bg-1: #0e1518;
    --bg-2: #14201f;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --text: #e8efee;
    --text-dim: rgba(232,239,238,0.6);
    --text-mute: rgba(232,239,238,0.4);
    --accent: oklch(0.78 0.13 180);
    --accent-2: oklch(0.78 0.13 145);
    --danger: oklch(0.7 0.18 25);
    --warn: oklch(0.85 0.15 90);
    --radius: 18px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse at 20% 0%, rgba(40,180,180,0.18), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(60,200,140,0.12), transparent 55%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }

  #root { height: 100%; width: 100%; }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }

  ::-webkit-scrollbar { height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
